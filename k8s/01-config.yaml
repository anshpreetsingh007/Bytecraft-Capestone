apiVersion: v1
kind: ConfigMap
metadata:
  name: markit-config
data:
  # General configuration
  AZURE_OPENAI_RESOURCE_NAME: "supermarkit-resource"
  AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-5-mini"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3005"
  SUBMISSION_SERVICE_URL: "http://submission-service:3007"
  
  # Internal Kubernetes PostgreSQL connection
  DATABASE_URL: "postgres://postgres:password@postgres:5432/markit_roofing"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "markit_roofing"
  DB_USER: "postgres"
  DB_PASSWORD: "password"

