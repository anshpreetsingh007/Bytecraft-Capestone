# ==========================================
# 1. AI Chatbot Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot-service
  template:
    metadata:
      labels:
        app: ai-chatbot-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: ai-chatbot-service
        image: markitroofing.azurecr.io/bytecraft-capestone-ai-chatbot-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: markit-config
        - secretRef:
            name: markit-secrets
        env:
        - name: PORT
          value: "3001"

        # Liveness deliberately hits /health, which does not touch the
        # database: a database blip should not get every pod restarted.
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3

        # Readiness hits /ready, which does query the database, so a pod that
        # cannot serve is pulled out of the Service rather than 500ing.
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        # Startup probe covers a slow first connection without forcing a long
        # initialDelay on the liveness probe.
        startupProbe:
          httpGet:
            path: /health
            port: 3001
          periodSeconds: 5
          failureThreshold: 24

        # Without requests the scheduler cannot pack nodes sensibly, and
        # without limits one runaway service can starve the rest.
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-service
spec:
  selector:
    app: ai-chatbot-service
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001

