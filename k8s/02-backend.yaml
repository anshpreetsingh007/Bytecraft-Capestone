# ==========================================
# 1. AI Chatbot Service
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-chatbot-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-chatbot-service
  template:
    metadata:
      labels:
        app: ai-chatbot-service
    spec:
      containers:
      - name: ai-chatbot-service
        image: markitroofing.azurecr.io/bytecraft-capestone-ai-chatbot-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: markit-config
        - secretRef:
            name: markit-secrets
        env:
        - name: PORT
          value: "3001"
---
apiVersion: v1
kind: Service
metadata:
  name: ai-chatbot-service
spec:
  selector:
    app: ai-chatbot-service
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001

