apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "markit_roofing"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "markit_roofing"]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres", "-d", "markit_roofing"]
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - name: postgres-init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-init-script
        configMap:
          # The ConfigMap in 06-postgres-schema.yaml is called
          # postgres-init-script. This said "postgres-schema", so the volume
          # never resolved and the pod sat in ContainerCreating.
          name: postgres-init-script
          # Postgres runs these once, on an empty data directory, in filename
          # order -- so the migrations have to follow the base schema.
          items:
          - key: markit_roofing.sql
            path: 01-schema.sql
          - key: 001_cost_estimate_dimensions.sql
            path: 02-migration-001.sql
          - key: 002_platform_hardening.sql
            path: 03-migration-002.sql
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
