apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nextjs-frontend
  template:
    metadata:
      labels:
        app: nextjs-frontend
    spec:
      containers:
      - name: nextjs-frontend
        image: markitroofing.azurecr.io/bytecraft-capestone-nextjs:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: markit-config
        - secretRef:
            name: markit-secrets
        env:
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: CHATBOT_SERVICE_URL
          value: "http://ai-chatbot-service:3001"
        - name: ESTIMATE_SERVICE_URL
          value: "http://estimate-service:3002"
        - name: INVENTORY_SERVICE_URL
          value: "http://inventory-service:3003"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:3004"
        - name: NOTIFICATION_SERVICE_URL
          value: "http://notification-service:3005"
        - name: REPORT_SERVICE_URL
          value: "http://report-service:3006"
        - name: SUBMISSION_SERVICE_URL
          value: "http://submission-service:3007"
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs-frontend
spec:
  type: LoadBalancer
  selector:
    app: nextjs-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 3000
