      context: ./microservices/submission-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - PORT=3007
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-markit-dev-internal-token}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-bytecraft-9a520}
