  # ─── Next.js Frontend (port 3000) ───────────
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    # service_started only means the container exists. Waiting for healthy
    # means the first page load does not hit a service still opening its
    # database pool.
    depends_on:
      ai-chatbot-service:
        condition: service_healthy
      estimate-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      report-service:
        condition: service_healthy
      submission-service:
        condition: service_healthy
    networks:
      - markit-network

networks:
  markit-network:
    driver: bridge

volumes:
  pg_data: