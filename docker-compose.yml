      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
    depends_on:
      postgres:
        condition: service_healthy
    # /ready checks the database too, so compose will not report a service
    # healthy until it can actually serve a request. node has fetch built in,
    # so this needs no curl in the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3007/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
