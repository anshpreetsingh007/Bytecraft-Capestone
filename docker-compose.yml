# =============================================
# Markit Roofing — Docker Compose
# =============================================
# Usage:
#   docker compose up --build        (first time / after code changes)
#   docker compose up                (subsequent runs)
#   docker compose down              (stop all)
#   docker compose down -v           (stop all + delete database volume)
# =============================================

services:
  # ─── PostgreSQL Database ────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.docker
    # Not published. Use `docker compose exec postgres psql ...` for a shell, or
    # add a port mapping in a local override file if you need pgAdmin.
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/markit_roofing.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # Migrations run in order after the base schema. They are idempotent, so
      # applying them to a fresh database is the same as applying them to an
      # existing one.
      - ./database/migrations/001_cost_estimate_dimensions.sql:/docker-entrypoint-initdb.d/02-migration-001.sql:ro
      - ./database/migrations/002_platform_hardening.sql:/docker-entrypoint-initdb.d/03-migration-002.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d markit_roofing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - markit-network

  # ─── AI Chatbot Service (port 3001) ─────────
  ai-chatbot-service:
    build:
      context: ./microservices/ai-chatbot-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - PORT=3001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-markit-dev-internal-token}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-bytecraft-9a520}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
      # The chatbot has no database of its own, so it resolves who it is
      # talking to through auth-service.
      - AUTH_SERVICE_URL=http://auth-service:3004
      - SUBMISSION_SERVICE_URL=http://submission-service:3007
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY_CHATBOT:-}
      - AZURE_OPENAI_RESOURCE_NAME=week8-workflow-ansh-resource
      - AZURE_OPENAI_DEPLOYMENT_NAME=gpt-4.1
    # /ready checks the database too, so compose will not report a service
    # healthy until it can actually serve a request. node has fetch built in,
    # so this needs no curl in the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - markit-network

  # ─── Estimate Service (port 3002) ───────────
  estimate-service:
    build:
      context: ./microservices/estimate-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
    environment:
      - PORT=3002
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-markit-dev-internal-token}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-bytecraft-9a520}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      # Approving an estimate draws the priced materials out of stock.
      - INVENTORY_SERVICE_URL=http://inventory-service:3003
    depends_on:
      postgres:
        condition: service_healthy
    # /ready checks the database too, so compose will not report a service
    # healthy until it can actually serve a request. node has fetch built in,
    # so this needs no curl in the image.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - markit-network

  # ─── Inventory Service (port 3003) ──────────
  inventory-service:
    build:
      context: ./microservices/inventory-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.docker
